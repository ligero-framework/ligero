rootProject.name = 'ligero'

// Módulos del framework
include 'core'      // ligero-core: API pública, router, middleware, SPIs (sin dependencias externas salvo slf4j-api)
include 'json'      // ligero-json: BodyMapper basado en Jackson
include 'server'    // ligero-server-jdk: ServerEngine sobre com.sun.net.httpserver con virtual threads
include 'auth'                // ligero-auth: JWT (HS256), CSRF y sesiones
include 'template-mustache'   // ligero-template-mustache: TemplateEngine con JMustache
include 'template-freemarker' // ligero-template-freemarker: TemplateEngine con FreeMarker
include 'template-pebble'     // ligero-template-pebble: TemplateEngine con Pebble
include 'otel'                // ligero-otel: Tracer -> OpenTelemetry
include 'otel-otlp'           // ligero-otel-otlp: SDK + exportador OTLP (trazas, métricas, logs) configurado con OTEL_*
include 'testkit'             // ligero-test: utilidades de testing end-to-end
include 'openapi'             // ligero-openapi: generación OpenAPI 3 desde las rutas
include 'metrics-micrometer'  // ligero-metrics-micrometer: adapter MetricsCollector -> Micrometer
include 'server-pluma'          // ligero-server-pluma: motor HTTP/1.1 + WebSocket propio sobre virtual threads (cero dependencias)
include 'compress-brotli'      // ligero-compress-brotli: codec Brotli para respuestas (ContentEncoder SPI, brotli4j)
include 'server-jetty'        // ligero-server-jetty: segundo ServerEngine (valida el SPI)
include 'jdbc'                // ligero-jdbc: helper liviano sobre DataSource (query -> record)
include 'migrations'          // ligero-migrations: migraciones de BD con Flyway
include 'validation'          // ligero-validation: Bean Validation (Hibernate Validator) -> 400
include 'devtools'            // ligero-devtools: dashboard de desarrollo (grafo de beans + trazas de requests)
include 'processor'          // ligero-processor: DI opcional en compilación (genera los bind() explícitos)
include 'config-yaml'        // ligero-config-yaml: ConfigSource desde ligero.yml + perfiles (SnakeYAML)
include 'jpa'                // ligero-jpa: helper liviano sobre JPA/Hibernate (EntityManagerFactory + transacciones)
include 'redis'              // ligero-redis: stores distribuidos (rate-limit + sesiones) sobre Redis
include 'benchmarks'          // JMH (no se publica)
include 'mcp'            // ligero-mcp: servidores Model Context Protocol (JSON-RPC 2.0)
include 'scheduler'      // ligero-scheduler: tareas en segundo plano (virtual threads)
include 'resilience'     // ligero-resilience: retry, timeout y circuit-breaker
include 'http-client'    // ligero-http-client: cliente HTTP fluido y declarativo (java.net.http), Problem Details, anti-SSRF
include 'graphql'        // ligero-graphql: API GraphQL (graphql-java) con límites de profundidad, complejidad y tamaño
include 'grpc'           // ligero-grpc: servicios gRPC (grpc-java) junto al servidor HTTP, mismo ciclo de vida
include 'jms'            // ligero-jms: mensajes JSON sobre cualquier broker Jakarta Messaging
include 'amqp'           // ligero-amqp: mensajes JSON sobre AMQP 1.0 (Qpid ProtonJ2)
include 'kafka'          // ligero-kafka: productor y consumidores Kafka con reintentos y dead-letter topic
include 'arch-test'      // solo tests de arquitectura (ArchUnit); no se publica
include 'examples'  // Aplicación de ejemplo (no se publica)
